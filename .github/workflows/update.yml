{"name":"Update data","on":{"schedule":[{"cron":"15 */3 * * *"},{"cron":"0 4,12 * * *"}],"workflow_dispatch":{"inputs":{"mode":{"description":"What to update","type":"choice","options":["all","forecast","people"],"default":"all"}}}},"permissions":{"contents":"write"},"concurrency":{"group":"update-data","cancel-in-progress":false},"jobs":{"update":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4"},{"name":"Run update robot","env":{"GEMINI_API_KEY":"${{ secrets.GEMINI_API_KEY }}","GEMINI_MODEL":"${{ vars.GEMINI_MODEL }}","EVENT":"${{ github.event_name }}","SCHEDULE":"${{ github.event.schedule }}","INPUT_MODE":"${{ inputs.mode }}"},"run":"MODE=forecast\nif [ \"$SCHEDULE\" = \"0 4,12 * * *\" ]; then MODE=all; fi\nif [ \"$EVENT\" = \"workflow_dispatch\" ]; then MODE=\"${INPUT_MODE:-all}\"; fi\necho \"mode: $MODE\"\nSCRIPT=scripts/update.rb\nif [ -f gal-hayom/scripts/update.rb ]; then SCRIPT=gal-hayom/scripts/update.rb; fi\nruby \"$SCRIPT\" \"$MODE\"\n"},{"name":"Save new data","run":"git config user.name \"gal-hayom-bot\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\nif git diff --cached --quiet; then echo \"no changes\"; exit 0; fi\ngit commit -m \"Update data $(TZ=Asia/Jerusalem date '+%d/%m %H:%M')\"\ngit pull --rebase\ngit push\n"}]}}}
